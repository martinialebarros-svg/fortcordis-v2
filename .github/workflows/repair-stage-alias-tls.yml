name: Repair Stage Alias TLS (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortcordis-vps-deploy
  cancel-in-progress: false

jobs:
  repair-stage-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Reuse repository deploy credentials. No new Environment or access policy.
    # Ref guards prevent mistakes; protected-branch review remains the code boundary.
    steps:
      - name: Require immutable stage dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != refs/heads/stage ]] || [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::This workflow requires an immutable stage dispatch.'
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test fixed target and recovery guards
        run: python3 -m unittest discover -s scripts/tests -p test_repair_stage_alias_tls.py

      - name: Prepare existing SSH access
        id: ssh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          set +x
          [[ "$VPS_HOST" == 216.238.116.77 ]]
          [[ "$VPS_USER" == martiniano ]]
          [[ -n "$VPS_SSH_KEY" ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_stage_alias
          # Public host key matches the previously trusted local known_hosts and
          # /etc/ssh/ssh_host_ed25519_key.pub read through that authenticated SSH.
          printf '%s\n' '216.238.116.77 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJCRqqAVE2A5znDduunv3lvuGpXYZPaX3EAYz1+90p5Y' > ~/.ssh/stage_alias_known_hosts

      - name: Copy reviewed stage script
        id: copy
        run: |
          set -euo pipefail
          remote_dir="/tmp/fortcordis-stage-alias-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$remote_dir" =~ ^/tmp/fortcordis-stage-alias-[0-9]+-[0-9]+$ ]]
          ssh -T -i ~/.ssh/id_stage_alias -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/stage_alias_known_hosts martiniano@216.238.116.77 "umask 077; mkdir '$remote_dir'"
          scp -i ~/.ssh/id_stage_alias -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/stage_alias_known_hosts scripts/repair_stage_alias_tls.py "martiniano@216.238.116.77:$remote_dir/repair_stage_alias_tls.py"

      - name: Validate DNS and repair only the stage certificate
        env:
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$VPS_SUDO_PASSWORD" ]]
          remote_dir="/tmp/fortcordis-stage-alias-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export STAGE_ALIAS_SCRIPT_DIGEST="$(sha256sum scripts/repair_stage_alias_tls.py | cut -d ' ' -f 1)"
          script_digest="$STAGE_ALIAS_SCRIPT_DIGEST"
          [[ "$script_digest" =~ ^[0-9a-f]{64}$ ]]
          # Root reads once, checks the approved digest and executes those exact
          # bytes. The user-owned upload is never reopened for privileged execution.
          remote_command="$(python3 - <<'PY'
          import os, re, shlex
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch(r'[0-9]+', run_id) or not re.fullmatch(r'[0-9]+', attempt):
              raise SystemExit(2)
          path = '/tmp/fortcordis-stage-alias-' + run_id + '-' + attempt + '/repair_stage_alias_tls.py'
          bootstrap = '''import hashlib, pathlib, sys
          path, expected, source_sha = sys.argv[1:]
          code = pathlib.Path(path).read_bytes()
          if hashlib.sha256(code).hexdigest() != expected:
              raise SystemExit('script_digest_mismatch')
          sys.argv = [path, '--execute-stage-alias', '--source-ref', 'refs/heads/stage', '--source-sha', source_sha, '--script-sha256', expected]
          exec(compile(code, path, 'exec'), {'__name__': '__main__', '__file__': path})
          '''
          print(shlex.join(['sudo', '-k', '-S', '-p', '', '--', '/usr/bin/python3', '-I', '-c', bootstrap,
                            path, os.environ['STAGE_ALIAS_SCRIPT_DIGEST'], os.environ['GITHUB_SHA']]))
          PY
          )"
          # Password travels through encrypted stdin, never argv, remote files or logs.
          printf '%s\n' "$VPS_SUDO_PASSWORD" | ssh -T -i ~/.ssh/id_stage_alias -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/stage_alias_known_hosts martiniano@216.238.116.77 "$remote_command"

      - name: Remove temporary script and ephemeral SSH key
        if: always() && github.ref == 'refs/heads/stage' && steps.ssh.outcome == 'success'
        run: |
          set -euo pipefail
          trap 'rm -f ~/.ssh/id_stage_alias ~/.ssh/stage_alias_known_hosts' EXIT
          remote_dir="/tmp/fortcordis-stage-alias-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$remote_dir" =~ ^/tmp/fortcordis-stage-alias-[0-9]+-[0-9]+$ ]]
          ssh -T -i ~/.ssh/id_stage_alias -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/stage_alias_known_hosts martiniano@216.238.116.77 "rm -f '$remote_dir/repair_stage_alias_tls.py'; if test -d '$remote_dir'; then rmdir '$remote_dir'; fi"
