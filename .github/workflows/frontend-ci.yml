name: Frontend CI
run-name: Diagnostic HTTPS second origin

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: "Shared UTC start, YYYY-MM-DDTHH:MM:SSZ; use 60-300 seconds ahead once the runner is ready"
        required: true
        type: string
      nonce:
        description: "Public correlation label: 8-32 ASCII letters or digits"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fortcordis-https-second-origin-diagnostic
  cancel-in-progress: false

jobs:
  public-https-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the dispatched diagnostic snapshot
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run the bounded public HTTPS collection
        env:
          DIAGNOSTIC_START_UTC: ${{ inputs.start_utc }}
          DIAGNOSTIC_NONCE: ${{ inputs.nonce }}
        run: |
          python3 scripts/diagnostics/https_origin_probe.py \
            --origin github \
            --nonce "$DIAGNOSTIC_NONCE" \
            --start-utc "$DIAGNOSTIC_START_UTC" \
            --output-dir output/https-origin-diagnostic \
            --execute

      - name: Preserve sanitized diagnostic measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: https-origin-github-${{ github.run_id }}
          path: |
            output/https-origin-diagnostic/observations.jsonl
            output/https-origin-diagnostic/summary.json
          if-no-files-found: warn
          retention-days: 7
