name: Apply secretary agenda permission hotfix

on:
  push:
    branches:
      - agent/fix-secretaria-matriz-agenda

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write migration, tests and SDD docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          migration = root / 'backend/migrations/versions/20260714_49_secretaria_excluir_agendamento.py'
          test_file = root / 'backend/tests/test_secretaria_agenda_permission_migration.py'
          spec_dir = root / 'docs/specs/agenda-secretaria-exclusao'
          spec_dir.mkdir(parents=True, exist_ok=True)

          migration.write_text('''"""Grant secretary role permission to delete appointments."""
          from __future__ import annotations

          from sqlalchemy import inspect, text
          from sqlalchemy.engine import Connection

          VERSION = "20260714_49"
          DESCRIPTION = "Libera exclusao de agendamentos para o papel secretaria"


          def upgrade(connection: Connection, dialect: str) -> None:
              inspector = inspect(connection)
              tables = set(inspector.get_table_names())
              if "papeis" not in tables or "papeis_permissoes" not in tables:
                  return

              papel_ids = connection.execute(
                  text("SELECT id FROM papeis WHERE LOWER(TRIM(nome)) = 'secretaria'")
              ).scalars().all()

              for papel_id in papel_ids:
                  permissao_id = connection.execute(
                      text(
                          "SELECT id FROM papeis_permissoes "
                          "WHERE papel_id = :papel_id AND modulo = 'agenda'"
                      ),
                      {"papel_id": papel_id},
                  ).scalar_one_or_none()

                  if permissao_id is None:
                      connection.execute(
                          text(
                              "INSERT INTO papeis_permissoes "
                              "(papel_id, modulo, visualizar, editar, excluir) "
                              "VALUES (:papel_id, 'agenda', 1, 1, 1)"
                          ),
                          {"papel_id": papel_id},
                      )
                      continue

                  connection.execute(
                      text(
                          "UPDATE papeis_permissoes "
                          "SET excluir = 1, updated_at = CURRENT_TIMESTAMP "
                          "WHERE id = :permissao_id"
                      ),
                      {"permissao_id": permissao_id},
                  )
          ''', encoding='utf-8')

          test_file.write_text('''import importlib.util
          import os
          import sys
          import tempfile
          import unittest
          from pathlib import Path

          from sqlalchemy import create_engine, text

          BACKEND_DIR = Path(__file__).resolve().parents[1]
          os.chdir(BACKEND_DIR)
          sys.path.insert(0, str(BACKEND_DIR))

          MIGRATION_PATH = BACKEND_DIR / "migrations" / "versions" / "20260714_49_secretaria_excluir_agendamento.py"
          SPEC = importlib.util.spec_from_file_location("migration_20260714_49", MIGRATION_PATH)
          if SPEC is None or SPEC.loader is None:
              raise RuntimeError(f"Nao foi possivel carregar migracao: {MIGRATION_PATH}")
          MIGRATION = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MIGRATION)


          class SecretariaAgendaPermissionMigrationTest(unittest.TestCase):
              def _build_engine(self):
                  tmpdir = tempfile.TemporaryDirectory()
                  db_path = Path(tmpdir.name) / "secretaria-agenda-permission.db"
                  engine = create_engine(f"sqlite:///{db_path}")
                  return tmpdir, engine

              def test_upgrade_updates_existing_permission(self) -> None:
                  tmpdir, engine = self._build_engine()
                  try:
                      with engine.begin() as conn:
                          conn.execute(text("CREATE TABLE papeis (id INTEGER PRIMARY KEY, nome TEXT NOT NULL)"))
                          conn.execute(text("""
                              CREATE TABLE papeis_permissoes (
                                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                                  papel_id INTEGER NOT NULL,
                                  modulo TEXT NOT NULL,
                                  visualizar INTEGER NOT NULL DEFAULT 1,
                                  editar INTEGER NOT NULL DEFAULT 0,
                                  excluir INTEGER NOT NULL DEFAULT 0,
                                  updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                                  UNIQUE (papel_id, modulo)
                              )
                          """))
                          conn.execute(text("INSERT INTO papeis (id, nome) VALUES (1, 'secretaria')"))
                          conn.execute(text("""
                              INSERT INTO papeis_permissoes
                              (papel_id, modulo, visualizar, editar, excluir)
                              VALUES (1, 'agenda', 1, 1, 0)
                          """))

                          MIGRATION.upgrade(conn, "sqlite")
                          MIGRATION.upgrade(conn, "sqlite")

                          excluir = conn.execute(text("""
                              SELECT excluir FROM papeis_permissoes
                              WHERE papel_id = 1 AND modulo = 'agenda'
                          """)).scalar_one()

                      self.assertEqual(excluir, 1)
                  finally:
                      engine.dispose()
                      tmpdir.cleanup()

              def test_upgrade_creates_missing_permission(self) -> None:
                  tmpdir, engine = self._build_engine()
                  try:
                      with engine.begin() as conn:
                          conn.execute(text("CREATE TABLE papeis (id INTEGER PRIMARY KEY, nome TEXT NOT NULL)"))
                          conn.execute(text("""
                              CREATE TABLE papeis_permissoes (
                                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                                  papel_id INTEGER NOT NULL,
                                  modulo TEXT NOT NULL,
                                  visualizar INTEGER NOT NULL DEFAULT 1,
                                  editar INTEGER NOT NULL DEFAULT 0,
                                  excluir INTEGER NOT NULL DEFAULT 0,
                                  updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                                  UNIQUE (papel_id, modulo)
                              )
                          """))
                          conn.execute(text("INSERT INTO papeis (id, nome) VALUES (7, 'Secretaria')"))

                          MIGRATION.upgrade(conn, "sqlite")

                          row = conn.execute(text("""
                              SELECT visualizar, editar, excluir
                              FROM papeis_permissoes
                              WHERE papel_id = 7 AND modulo = 'agenda'
                          """)).one()

                      self.assertEqual(tuple(row), (1, 1, 1))
                  finally:
                      engine.dispose()
                      tmpdir.cleanup()


          if __name__ == "__main__":
              unittest.main()
          ''', encoding='utf-8')

          (spec_dir / 'intent.md').write_text('''# Intent

          Permitir que usuarios com o papel `secretaria` excluam agendamentos na agenda de producao, mantendo a auditoria e sem liberar exclusao para outros papeis.
          ''', encoding='utf-8')

          (spec_dir / 'spec.md').write_text('''# Specification

          ## Problema

          A rota `DELETE /api/v1/agenda/{agendamento_id}` aceita `admin` e `secretaria`, mas a matriz global de permissoes intercepta a requisicao antes do endpoint e bloqueia o papel `secretaria` quando `papeis_permissoes.excluir` esta desativado para o modulo `agenda`.

          ## Comportamento esperado

          - O papel `secretaria` deve ter `excluir = 1` no modulo `agenda`.
          - O papel `admin` permanece com acesso total.
          - Outros papeis continuam sujeitos a matriz configurada.
          - A exclusao continua gerando auditoria e notificacao em tempo real.

          ## Implementacao

          Uma migracao idempotente atualiza a permissao existente ou cria a linha ausente para `secretaria` no modulo `agenda`.
          ''', encoding='utf-8')

          (spec_dir / 'plan.md').write_text('''# Plan

          1. Criar migracao idempotente para a matriz de permissoes.
          2. Cobrir atualizacao de linha existente e criacao de linha ausente em SQLite.
          3. Executar a suite de testes e o gate SDD.
          4. Publicar em `main` para acionar o deploy automatico e as migracoes da VPS.
          ''', encoding='utf-8')

          (spec_dir / 'verify.md').write_text('''# Verification

          - Teste automatizado confirma que `excluir` muda de `0` para `1` para o papel `secretaria` no modulo `agenda`.
          - Teste automatizado confirma a criacao idempotente da permissao quando a linha nao existe.
          - O deploy de producao deve executar a migracao `20260714_49` antes de reiniciar o backend.
          - A validacao funcional final e excluir um agendamento com uma sessao autenticada de secretaria.
          ''', encoding='utf-8')
          PY

      - name: Validate targeted migration
        shell: bash
        run: |
          python -m pip install sqlalchemy
          python -m unittest backend/tests/test_secretaria_agenda_permission_migration.py
          python -m py_compile backend/migrations/versions/20260714_49_secretaria_excluir_agendamento.py

      - name: Commit final hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/hotfix-secretaria-excluir-agendamento.yml || true
          git rm -f .github/workflows/hotfix-secretaria-matriz-agenda.yml
          git add backend/migrations/versions/20260714_49_secretaria_excluir_agendamento.py \
                  backend/tests/test_secretaria_agenda_permission_migration.py \
                  docs/specs/agenda-secretaria-exclusao
          git commit -m 'fix(agenda): liberar exclusao na matriz da secretaria'
          git push origin HEAD:agent/fix-secretaria-matriz-agenda
