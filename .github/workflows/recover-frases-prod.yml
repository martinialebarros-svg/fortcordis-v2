name: Recover Frases Prod Manual

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy recovery script to VPS
        run: |
          scp -i ~/.ssh/id_vps -o IdentitiesOnly=yes scripts/recover_frases_prod.py ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/recover_frases_prod.py

      - name: Recover frases on production VPS
        run: |
          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            APP_DIR="/var/www/fortcordis-v2"
            cd "$APP_DIR"
            python3 /tmp/recover_frases_prod.py "$APP_DIR"
            rm -f /tmp/recover_frases_prod.py
            sudo systemctl restart fortcordis-backend
            echo "Backend reiniciado com sucesso"
          EOF
