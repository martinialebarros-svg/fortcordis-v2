name: Recover Frases Prod Manual

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar restauracao em producao"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      token:
        description: "Texto esperado nos labels (ex.: DMVM)"
        required: true
        default: "DMVM"

jobs:
  recover-prod:
    runs-on: ubuntu-latest
    # Job de produção: o binding de Environment precisa existir no YAML
    # para que mover os secrets da VPS para um Environment protegido
    # (required reviewers) seja so uma mudanca de configuracao. Sem
    # `environment:`, o job perde acesso a esses secrets.
    environment: production
    steps:
      - name: Exigir dispatch a partir de main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Em workflow_dispatch o YAML executado vem do ref selecionado, nao
          # do default branch: fixar `ref` no checkout protege os arquivos
          # copiados, mas nao os proprios passos `run` deste job. Este guard
          # evita o acidente de rodar produção a partir de `stage` (que passa a
          # ser o ref default do dispatch). Nao protege contra edicao
          # deliberada do workflow em `stage` - para isso, ver a nota de
          # Environment protegido em docs/RUNBOOK-STAGE-PROD.md.
          if [[ "${DISPATCH_REF}" != "refs/heads/main" ]]; then
            echo "::error::Este workflow aplica mudancas em produção e deve ser disparado com a branch 'main' (ref recebido: ${DISPATCH_REF})."
            echo "Reexecute selecionando 'main' no seletor de branch do dispatch."
            exit 1
          fi
          echo "OK: dispatch a partir de main."

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy recovery script to production VPS
        run: |
          scp -i ~/.ssh/id_vps -o IdentitiesOnly=yes scripts/recover_frases_stage.py ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/recover_frases_prod.py

      - name: Inspect/Recover frases on production VPS
        env:
          APPLY: ${{ github.event.inputs.apply }}
          TOKEN: ${{ github.event.inputs.token }}
        run: |
          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "export APPLY='${APPLY}' TOKEN='${TOKEN}'; bash -s" <<'EOF'
            set -euo pipefail
            APP_DIR="/var/www/fortcordis-v2"
            cd "$APP_DIR"

            if [ "${APPLY}" = "true" ]; then
              python3 /tmp/recover_frases_prod.py --app-dir "$APP_DIR" --token "${TOKEN}" --apply
            else
              python3 /tmp/recover_frases_prod.py --app-dir "$APP_DIR" --token "${TOKEN}"
            fi

            rm -f /tmp/recover_frases_prod.py
            sudo systemctl restart fortcordis-backend
            echo "Backend reiniciado com sucesso"
          EOF
