name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Add VPS to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS
      run: |
        ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -euo pipefail
          APP_DIR="/var/www/fortcordis-v2"
          BRANCH="main"

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "ERROR: $APP_DIR is not a git checkout"
            exit 1
          fi

          cd "$APP_DIR"
          echo "Updating checkout to origin/${BRANCH}..."
          git fetch origin
          git checkout "$BRANCH"
          git reset --hard "origin/${BRANCH}"

          echo "Running standardized production deploy script..."
          APP_DIR="$APP_DIR" BRANCH="$BRANCH" bash scripts/deploy_prod_vps.sh
        EOF
