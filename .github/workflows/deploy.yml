name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: fortcordis-vps-deploy
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortcordis_stage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortcordis_stage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test WhatsApp stage Meta isolation
        run: bash scripts/tests/test_whatsapp_stage_meta_isolation.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend test suite
        env:
          DATABASE_URL: sqlite:///./fortcordis-ci.db
          SECRET_KEY: deploy-main-quality-gate-secret-key-1234567890
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            whatsapp-stage-backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Install WhatsApp backend dependencies
        working-directory: whatsapp-stage-backend
        run: npm ci

      - name: Build WhatsApp backend
        working-directory: whatsapp-stage-backend
        run: npm run build

      - name: Test WhatsApp backend
        working-directory: whatsapp-stage-backend
        run: |
          npm run test:reservation-template
          npm run test:approved-templates
          npm run test:document-templates
          npm run test:database-config
          npm run test:express-http
          npm run test:inbox-ui
          npm run test:customer-service-window
          npm run test:phone-number
          npm run test:whatsapp-retry
          npm run test:message-attachment
          npm run test:auth-policy
          npm run test:webhook-cleanup-config
          npm run test:log-redaction
          npm audit --omit=dev

  sdd-guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: diff
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$HEAD_SHA"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Run SDD guardrail
        run: |
          python3 scripts/ci/check_sdd_guardrail.py \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}"

  deploy:
    needs:
      - quality-gate
      - sdd-guardrail
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup SSH key
      env:
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_vps
        chmod 600 ~/.ssh/id_vps

    - name: Add VPS to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Configure OpenAI secret on Production VPS
      env:
        OPENAI_API_KEY_PROD: ${{ secrets.OPENAI_API_KEY_PROD }}
      run: |
        if [ -z "$OPENAI_API_KEY_PROD" ]; then
          echo "OPENAI_API_KEY_PROD is not configured."
          exit 1
        fi

        printf '%s\n' "$OPENAI_API_KEY_PROD" | \
          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -euo pipefail
            umask 077
            IFS= read -r openai_api_key
            if [ -z "$openai_api_key" ]; then
              echo "Received an empty OpenAI API key."
              exit 1
            fi

            env_file="/var/www/fortcordis-v2/backend/.env"
            if [ ! -f "$env_file" ]; then
              echo "Production backend env file not found."
              exit 1
            fi

            temp_file="${env_file}.openai.$$"
            trap "rm -f \"$temp_file\"" EXIT
            found=0
            : > "$temp_file"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                OPENAI_API_KEY=*)
                  printf "OPENAI_API_KEY=%s\n" "$openai_api_key" >> "$temp_file"
                  found=1
                  ;;
                *)
                  printf "%s\n" "$line" >> "$temp_file"
                  ;;
              esac
            done < "$env_file"
            if [ "$found" -eq 0 ]; then
              printf "OPENAI_API_KEY=%s\n" "$openai_api_key" >> "$temp_file"
            fi

            chmod --reference="$env_file" "$temp_file"
            mv "$temp_file" "$env_file"
            trap - EXIT
            unset openai_api_key
            echo "Production backend OpenAI secret configured."
          '

    - name: Configure echo voice assistant on Production VPS
      run: |
        ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -euo pipefail
          env_file="/var/www/fortcordis-v2/backend/.env"
          if [ ! -f "$env_file" ]; then
            echo "Production backend env file not found."
            exit 1
          fi

          upsert_env() {
            key="$1"
            value="$2"
            temp_file="${env_file}.${key}.$$"
            awk -v key="$key" -v value="$value" '
              BEGIN { found = 0 }
              index($0, key "=") == 1 {
                print key "=" value
                found = 1
                next
              }
              { print }
              END {
                if (!found) print key "=" value
              }
            ' "$env_file" > "$temp_file"
            chmod --reference="$env_file" "$temp_file"
            mv "$temp_file" "$env_file"
          }

          upsert_env AI_ECHO_ASSISTANT_ENABLED true
          upsert_env AI_PROVIDER openai
          upsert_env AI_TRANSCRIPTION_MODEL gpt-4o-transcribe
          upsert_env AI_STRUCTURING_MODEL gpt-5.6-sol
          upsert_env AI_ECHO_REASONING_EFFORT low
          upsert_env AI_ECHO_MAX_OUTPUT_TOKENS 8000
          upsert_env AI_AUDIO_RETENTION_HOURS 2
          upsert_env AI_ECHO_AUDIO_MAX_BYTES 20971520
          upsert_env AI_ECHO_AUDIO_MAX_SECONDS 600
          upsert_env AI_ECHO_MAX_ATTEMPTS 3
          upsert_env AI_ECHO_MONTHLY_SESSION_LIMIT 100
          echo "Production echo voice assistant configuration updated."
        EOF

    - name: Deploy to VPS
      run: |
        ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -euo pipefail
          APP_DIR="/var/www/fortcordis-v2"
          BRANCH="main"

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "ERROR: $APP_DIR is not a git checkout"
            exit 1
          fi

          cd "$APP_DIR"
          echo "Loading standardized production deploy script from origin/$BRANCH..."
          git fetch origin "$BRANCH"
          DEPLOY_SCRIPT_DIR="$(mktemp -d)"
          trap 'rm -rf "$DEPLOY_SCRIPT_DIR"' EXIT
          git archive --format=tar "origin/$BRANCH" -- \
            scripts/deploy_prod_vps.sh \
            scripts/ensure_nginx_http2.sh | tar -xf - -C "$DEPLOY_SCRIPT_DIR"
          chmod 700 "$DEPLOY_SCRIPT_DIR/scripts/deploy_prod_vps.sh" "$DEPLOY_SCRIPT_DIR/scripts/ensure_nginx_http2.sh"
          echo "Running standardized production deploy script..."
          SUDO_PASSWORD='${{ secrets.VPS_SUDO_PASSWORD }}' \
            APP_DIR="$APP_DIR" \
            BRANCH="$BRANCH" \
            ENABLE_WHATSAPP_STAGE_BACKEND=1 \
            WHATSAPP_STAGE_BACKEND_SERVICE=fortcordis-whatsapp-backend \
            WHATSAPP_STAGE_BACKEND_PORT=3020 \
            WHATSAPP_STAGE_BACKEND_URL=http://127.0.0.1:3020 \
            WHATSAPP_EXPECTED_PHONE_NUMBER_ID=1279142515283484 \
            WHATSAPP_EXPECTED_META_APP_ID=975334532125008 \
            WHATSAPP_EXPECTED_BUSINESS_ACCOUNT_ID=1369494994627980 \
            WHATSAPP_REQUIRE_DISTINCT_FROM_PRODUCTION=0 \
            WHATSAPP_DATABASE_SSL_REJECT_UNAUTHORIZED=false \
            WHATSAPP_RUNTIME_LABEL=Production \
            ENABLE_WHATSAPP_STAGE_SMOKE=0 \
            bash "$DEPLOY_SCRIPT_DIR/scripts/deploy_prod_vps.sh"
        EOF
