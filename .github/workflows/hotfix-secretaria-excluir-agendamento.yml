name: Apply secretary appointment-delete hotfix

on:
  push:
    branches:
      - agent/secretaria-excluir-agendamento

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path.cwd()
          backend = repo / 'backend/app/api/v1/endpoints/agenda.py'
          agenda_page = repo / 'frontend/app/agenda/page.tsx'
          fullcalendar_page = repo / 'frontend/app/agenda/fullcalendar/page.tsx'
          permissions_module = repo / 'backend/app/core/agenda_permissions.py'
          test_file = repo / 'backend/tests/test_agenda_delete_permissions.py'

          backend_text = backend.read_text(encoding='utf-8')
          import_anchor = 'from app.core.security import get_current_user\n'
          import_line = 'from app.core.agenda_permissions import usuario_pode_excluir_agendamento\n'
          if import_line not in backend_text:
              if backend_text.count(import_anchor) != 1:
                  raise RuntimeError('Unexpected agenda.py security import anchor')
              backend_text = backend_text.replace(import_anchor, import_anchor + import_line, 1)

          old_block = '''    \"\"\"Deleta agendamento (sÃƒÆ’Ã‚Â³ admin)\"\"\"\n    from sqlalchemy import text\n    _ensure_agendamento_workflow_columns(db)\n    papel = db.execute(\n        text(\"SELECT p.nome FROM papeis p JOIN usuario_papel up ON p.id = up.papel_id WHERE up.usuario_id = :uid\"),\n        {\"uid\": current_user.id}\n    ).fetchone()\n    if not papel or papel[0] != \"admin\":\n        raise HTTPException(status_code=403, detail=\"Apenas administradores podem excluir agendamentos\")\n'''
          new_block = '''    \"\"\"Deleta agendamento quando o usuario e admin ou secretaria.\"\"\"\n    _ensure_agendamento_workflow_columns(db)\n    if not usuario_pode_excluir_agendamento(current_user):\n        raise HTTPException(\n            status_code=403,\n            detail=\"Apenas administradores e secretarias podem excluir agendamentos\",\n        )\n'''
          if old_block not in backend_text:
              raise RuntimeError('Unexpected delete authorization block in agenda.py')
          backend_text = backend_text.replace(old_block, new_block, 1)
          backend.write_text(backend_text, encoding='utf-8')

          for frontend_file in (agenda_page, fullcalendar_page):
              text = frontend_file.read_text(encoding='utf-8')
              old_message = 'Apenas administradores podem excluir agendamentos'
              new_message = 'Apenas administradores e secretarias podem excluir agendamentos'
              if old_message not in text:
                  raise RuntimeError(f'Expected delete permission message not found in {frontend_file}')
              frontend_file.write_text(text.replace(old_message, new_message), encoding='utf-8')

          permissions_module.write_text('''from typing import Any\n\n\nPAPEIS_QUE_PODEM_EXCLUIR_AGENDAMENTO = (\"admin\", \"secretaria\")\n\n\ndef usuario_pode_excluir_agendamento(usuario: Any) -> bool:\n    \"\"\"Retorna True quando o usuario pode excluir um agendamento.\"\"\"\n    tem_papel = getattr(usuario, \"tem_papel\", None)\n    if not callable(tem_papel):\n        return False\n\n    for papel in PAPEIS_QUE_PODEM_EXCLUIR_AGENDAMENTO:\n        try:\n            if bool(tem_papel(papel)):\n                return True\n        except Exception:\n            return False\n    return False\n''', encoding='utf-8')

          test_file.write_text('''import sys\nimport unittest\nfrom pathlib import Path\n\n\nBACKEND_DIR = Path(__file__).resolve().parents[1]\nif str(BACKEND_DIR) not in sys.path:\n    sys.path.insert(0, str(BACKEND_DIR))\n\nfrom app.core.agenda_permissions import usuario_pode_excluir_agendamento\n\n\nclass UsuarioFake:\n    def __init__(self, papeis):\n        self.papeis = {str(papel).strip().lower() for papel in papeis}\n\n    def tem_papel(self, papel):\n        return str(papel).strip().lower() in self.papeis\n\n\nclass AgendaDeletePermissionsTests(unittest.TestCase):\n    def test_admin_pode_excluir(self):\n        self.assertTrue(usuario_pode_excluir_agendamento(UsuarioFake({\"admin\"})))\n\n    def test_secretaria_pode_excluir(self):\n        self.assertTrue(usuario_pode_excluir_agendamento(UsuarioFake({\"secretaria\"})))\n\n    def test_multiplos_papeis_nao_dependem_da_ordem(self):\n        self.assertTrue(usuario_pode_excluir_agendamento(UsuarioFake({\"medico\", \"secretaria\"})))\n\n    def test_outros_papeis_nao_podem_excluir(self):\n        self.assertFalse(usuario_pode_excluir_agendamento(UsuarioFake({\"medico\"})))\n        self.assertFalse(usuario_pode_excluir_agendamento(UsuarioFake({\"parceiro\"})))\n\n    def test_usuario_sem_metodo_de_papel_nao_pode_excluir(self):\n        self.assertFalse(usuario_pode_excluir_agendamento(object()))\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Validate hotfix
        shell: bash
        run: |
          python -m unittest backend/tests/test_agenda_delete_permissions.py
          python -m py_compile backend/app/core/agenda_permissions.py backend/app/api/v1/endpoints/agenda.py
          grep -q 'usuario_pode_excluir_agendamento(current_user)' backend/app/api/v1/endpoints/agenda.py
          grep -q 'administradores e secretarias' frontend/app/agenda/page.tsx
          grep -q 'administradores e secretarias' frontend/app/agenda/fullcalendar/page.tsx

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/api/v1/endpoints/agenda.py \
                  backend/app/core/agenda_permissions.py \
                  backend/tests/test_agenda_delete_permissions.py \
                  frontend/app/agenda/page.tsx \
                  frontend/app/agenda/fullcalendar/page.tsx
          git commit -m 'fix(agenda): permitir exclusao pela secretaria'
          git push origin HEAD:agent/secretaria-excluir-agendamento
