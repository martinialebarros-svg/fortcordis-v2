name: Outflow runtime read-only observation
on:
  push:
    branches: [codex/outflow-release-smoke]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read production HEAD and internal health without changing runtime
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_key="$(mktemp)"
          task_hosts="$(mktemp)"
          trap 'rm -f "$task_key" "$task_hosts"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$task_key"
          ssh-keyscan -T 5 -H "$VPS_HOST" > "$task_hosts" 2>/dev/null
          ssh -T -i "$task_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o UserKnownHostsFile="$task_hosts" "$VPS_USER@$VPS_HOST" python3 - <<'PY'
          import json, re, subprocess, urllib.request, urllib.error
          result = {"event": "outflow_runtime_readonly"}
          process = subprocess.run(["git", "-C", "/var/www/fortcordis-v2", "rev-parse", "HEAD"], capture_output=True, text=True, timeout=5)
          candidate = process.stdout.strip()
          result["git_head"] = candidate if re.fullmatch(r"[0-9a-f]{40}", candidate) else "unavailable"
          for service in ("fortcordis-backend", "fortcordis-frontend", "fortcordis-worker"):
              state = subprocess.run(["systemctl", "is-active", service], capture_output=True, text=True, timeout=5).stdout.strip()
              result[service] = state if state in ("active", "inactive", "failed", "activating", "deactivating", "unknown") else "unavailable"
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=8) as response:
                  result["health_http"] = response.status
                  payload = json.loads(response.read(524288))
              result["readiness"] = payload.get("readiness") if payload.get("readiness") in ("ready", "not_ready", "degraded") else "unavailable"
              value = payload
              for key in ("checks", "observability", "http_latency_monitor", "persistence", "release_id"):
                  value = value.get(key) if isinstance(value, dict) else None
              result["runtime_release_id"] = value if isinstance(value, str) and re.fullmatch(r"[0-9a-fA-F]{7,40}", value) else "unavailable"
          except Exception as error:
              result["health_error"] = type(error).__name__
          print(json.dumps(result, sort_keys=True))
          PY
