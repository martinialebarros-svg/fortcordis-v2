name: Deploy to Stage (VPS)

on:
  push:
    branches:
      - stage

concurrency:
  group: fortcordis-vps-deploy
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortcordis_stage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortcordis_stage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test WhatsApp stage Meta isolation
        run: bash scripts/tests/test_whatsapp_stage_meta_isolation.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend test suite
        env:
          DATABASE_URL: sqlite:///./fortcordis-ci.db
          SECRET_KEY: deploy-stage-quality-gate-secret-key-1234567890
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            whatsapp-stage-backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Install WhatsApp backend dependencies
        working-directory: whatsapp-stage-backend
        run: npm ci

      - name: Build WhatsApp backend
        working-directory: whatsapp-stage-backend
        run: npm run build

      - name: Test WhatsApp backend
        working-directory: whatsapp-stage-backend
        run: |
          npm run test:reservation-template
          npm run test:approved-templates
          npm run test:document-templates
          npm run test:database-config
          npm run test:express-http
          npm run test:inbox-ui
          npm run test:customer-service-window
          npm run test:phone-number
          npm run test:whatsapp-retry
          npm run test:message-attachment
          npm run test:auth-policy
          npm run test:webhook-cleanup-config
          npm run test:log-redaction
          npm audit --omit=dev

  sdd-guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: diff
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$HEAD_SHA"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Run SDD guardrail
        run: |
          python3 scripts/ci/check_sdd_guardrail.py \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}"

  deploy-stage:
    needs:
      - quality-gate
      - sdd-guardrail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Configure OpenAI secret on Stage VPS
        env:
          OPENAI_API_KEY_STAGE: ${{ secrets.OPENAI_API_KEY_STAGE }}
        run: |
          if [ -z "$OPENAI_API_KEY_STAGE" ]; then
            echo "OPENAI_API_KEY_STAGE is not configured."
            exit 1
          fi

          printf '%s\n' "$OPENAI_API_KEY_STAGE" | \
            ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
              set -euo pipefail
              umask 077
              IFS= read -r openai_api_key
              if [ -z "$openai_api_key" ]; then
                echo "Received an empty OpenAI API key."
                exit 1
              fi

              env_file="/var/www/fortcordis-stage/backend/.env"
              if [ ! -f "$env_file" ]; then
                echo "Stage backend env file not found."
                exit 1
              fi

              temp_file="${env_file}.openai.$$"
              trap "rm -f \"$temp_file\"" EXIT
              found=0
              : > "$temp_file"
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in
                  OPENAI_API_KEY=*)
                    printf "OPENAI_API_KEY=%s\n" "$openai_api_key" >> "$temp_file"
                    found=1
                    ;;
                  *)
                    printf "%s\n" "$line" >> "$temp_file"
                    ;;
                esac
              done < "$env_file"
              if [ "$found" -eq 0 ]; then
                printf "OPENAI_API_KEY=%s\n" "$openai_api_key" >> "$temp_file"
              fi

              chmod --reference="$env_file" "$temp_file"
              mv "$temp_file" "$env_file"
              trap - EXIT
              unset openai_api_key
              echo "Stage backend OpenAI secret configured."
            '

      - name: Configure echo voice assistant on Stage VPS
        run: |
          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            env_file="/var/www/fortcordis-stage/backend/.env"
            if [ ! -f "$env_file" ]; then
              echo "Stage backend env file not found."
              exit 1
            fi

            upsert_env() {
              key="$1"
              value="$2"
              temp_file="${env_file}.${key}.$$"
              awk -v key="$key" -v value="$value" '
                BEGIN { found = 0 }
                index($0, key "=") == 1 {
                  print key "=" value
                  found = 1
                  next
                }
                { print }
                END {
                  if (!found) print key "=" value
                }
              ' "$env_file" > "$temp_file"
              chmod --reference="$env_file" "$temp_file"
              mv "$temp_file" "$env_file"
            }

            upsert_env AI_ECHO_ASSISTANT_ENABLED true
            upsert_env AI_PROVIDER openai
            upsert_env AI_TRANSCRIPTION_MODEL gpt-4o-transcribe
            upsert_env AI_STRUCTURING_MODEL gpt-5.6-sol
            upsert_env AI_ECHO_REASONING_EFFORT low
            upsert_env AI_ECHO_MAX_OUTPUT_TOKENS 8000
            upsert_env AI_AUDIO_RETENTION_HOURS 2
            upsert_env AI_ECHO_AUDIO_MAX_BYTES 20971520
            upsert_env AI_ECHO_AUDIO_MAX_SECONDS 600
            upsert_env AI_ECHO_MAX_ATTEMPTS 3
            upsert_env AI_ECHO_MONTHLY_SESSION_LIMIT 100
            echo "Stage echo voice assistant configuration updated."
          EOF

      - name: Configure isolated WhatsApp Cloud API identity on Stage VPS
        env:
          WHATSAPP_ACCESS_TOKEN_STAGE: ${{ secrets.WHATSAPP_ACCESS_TOKEN_STAGE }}
          WHATSAPP_APP_SECRET_STAGE: ${{ secrets.WHATSAPP_APP_SECRET_STAGE }}
          WHATSAPP_VERIFY_TOKEN_STAGE: ${{ secrets.WHATSAPP_VERIFY_TOKEN_STAGE }}
          WHATSAPP_PHONE_NUMBER_ID_STAGE: ${{ vars.WHATSAPP_PHONE_NUMBER_ID_STAGE }}
          WHATSAPP_META_APP_ID_STAGE: ${{ vars.WHATSAPP_META_APP_ID_STAGE }}
          WHATSAPP_BUSINESS_ACCOUNT_ID_STAGE: ${{ vars.WHATSAPP_BUSINESS_ACCOUNT_ID_STAGE }}
        run: |
          set -euo pipefail

          if [[ -z "$WHATSAPP_ACCESS_TOKEN_STAGE" || "$WHATSAPP_ACCESS_TOKEN_STAGE" != EAA* || ${#WHATSAPP_ACCESS_TOKEN_STAGE} -lt 64 ]]; then
            echo "WHATSAPP_ACCESS_TOKEN_STAGE is missing or invalid."
            exit 1
          fi
          if [[ ! "$WHATSAPP_APP_SECRET_STAGE" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "WHATSAPP_APP_SECRET_STAGE is missing or invalid."
            exit 1
          fi
          if [[ -z "$WHATSAPP_VERIFY_TOKEN_STAGE" || ${#WHATSAPP_VERIFY_TOKEN_STAGE} -lt 16 ]]; then
            echo "WHATSAPP_VERIFY_TOKEN_STAGE is missing or invalid."
            exit 1
          fi

          for identity_var in \
            WHATSAPP_PHONE_NUMBER_ID_STAGE \
            WHATSAPP_META_APP_ID_STAGE \
            WHATSAPP_BUSINESS_ACCOUNT_ID_STAGE; do
            identity_value="${!identity_var:-}"
            if [[ ! "$identity_value" =~ ^[0-9]{10,32}$ ]]; then
              echo "${identity_var} GitHub variable is missing or invalid."
              exit 1
            fi
          done

          if [[ "$WHATSAPP_PHONE_NUMBER_ID_STAGE" == "1279142515283484" || \
                "$WHATSAPP_META_APP_ID_STAGE" == "975334532125008" || \
                "$WHATSAPP_BUSINESS_ACCOUNT_ID_STAGE" == "1369494994627980" ]]; then
            echo "Stage WhatsApp identity must be isolated from production."
            exit 1
          fi

          WHATSAPP_ACCESS_TOKEN="$WHATSAPP_ACCESS_TOKEN_STAGE" \
            PHONE_NUMBER_ID="$WHATSAPP_PHONE_NUMBER_ID_STAGE" \
            META_APP_ID="$WHATSAPP_META_APP_ID_STAGE" \
            WHATSAPP_BUSINESS_ACCOUNT_ID="$WHATSAPP_BUSINESS_ACCOUNT_ID_STAGE" \
            WHATSAPP_GRAPH_API_VERSION=v26.0 \
            WHATSAPP_ALLOW_UNVERIFIED_TEST_NUMBER=1 \
            WHATSAPP_REQUIRE_SUBSCRIBED_APP=0 \
            bash scripts/whatsapp_meta_identity_check.sh

          printf '%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$WHATSAPP_ACCESS_TOKEN_STAGE" \
            "$WHATSAPP_APP_SECRET_STAGE" \
            "$WHATSAPP_VERIFY_TOKEN_STAGE" \
            "$WHATSAPP_PHONE_NUMBER_ID_STAGE" \
            "$WHATSAPP_META_APP_ID_STAGE" \
            "$WHATSAPP_BUSINESS_ACCOUNT_ID_STAGE" | \
            ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
              set -euo pipefail
              umask 077

              IFS= read -r whatsapp_access_token
              IFS= read -r whatsapp_app_secret
              IFS= read -r whatsapp_verify_token
              IFS= read -r whatsapp_phone_number_id
              IFS= read -r whatsapp_meta_app_id
              IFS= read -r whatsapp_business_account_id

              if [ -z "$whatsapp_access_token" ] || [ -z "$whatsapp_app_secret" ] || \
                 [ -z "$whatsapp_verify_token" ] || [ -z "$whatsapp_phone_number_id" ] || \
                 [ -z "$whatsapp_meta_app_id" ] || [ -z "$whatsapp_business_account_id" ]; then
                echo "Received incomplete WhatsApp stage configuration."
                exit 1
              fi

              env_file="/var/www/fortcordis-stage/whatsapp-stage-backend/.env"
              if [ ! -f "$env_file" ]; then
                echo "Stage WhatsApp env file not found. Run the bootstrap deploy before configuring Meta secrets."
                exit 1
              fi

              upsert_env() {
                key="$1"
                value="$2"
                temp_file="${env_file}.${key}.$$"
                found=0
                : > "$temp_file"
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    "$key="*)
                      printf "%s=%s\n" "$key" "$value" >> "$temp_file"
                      found=1
                      ;;
                    *)
                      printf "%s\n" "$line" >> "$temp_file"
                      ;;
                  esac
                done < "$env_file"
                if [ "$found" -eq 0 ]; then
                  printf "%s=%s\n" "$key" "$value" >> "$temp_file"
                fi
                chmod 600 "$temp_file"
                mv "$temp_file" "$env_file"
              }

              upsert_env WHATSAPP_ACCESS_TOKEN "$whatsapp_access_token"
              upsert_env WHATSAPP_APP_SECRET "$whatsapp_app_secret"
              upsert_env WHATSAPP_VERIFY_TOKEN "$whatsapp_verify_token"
              upsert_env PHONE_NUMBER_ID "$whatsapp_phone_number_id"
              upsert_env META_APP_ID "$whatsapp_meta_app_id"
              upsert_env WHATSAPP_BUSINESS_ACCOUNT_ID "$whatsapp_business_account_id"
              upsert_env WHATSAPP_GRAPH_API_VERSION "v26.0"
              upsert_env WHATSAPP_ALLOW_UNVERIFIED_TEST_NUMBER "1"
              # So em stage: o numero de TESTE da Meta guarda os destinatarios
              # permitidos COM o nono digito, entao enviar na forma de 12
              # digitos e recusado com OAuthException/131030. Producao nao tem
              # lista de permitidos e entrega na forma de 12 digitos - por isso
              # a flag e opt-in e nao pode ir para o deploy de producao.
              upsert_env WHATSAPP_GRAPH_FORCE_BR_MOBILE_NINTH_DIGIT "true"
              chmod 600 "$env_file"

              unset whatsapp_access_token whatsapp_app_secret whatsapp_verify_token \
                whatsapp_phone_number_id whatsapp_meta_app_id whatsapp_business_account_id
              echo "Stage WhatsApp Cloud API identity configured without exposing values."
            '

      - name: Remove obsolete env keys on Stage VPS
        run: |
          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            env_file="/var/www/fortcordis-stage/backend/.env"
            if [ -f "$env_file" ]; then
              sed -i '/^WHATSAPP_REMINDER_SCHEDULER_ENABLED=/d' "$env_file"
              chmod 600 "$env_file"
              echo "Removed obsolete WHATSAPP_REMINDER_SCHEDULER_ENABLED if present."
            fi
          EOF

      - name: Deploy to Stage (VPS)
        run: |
          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            APP_DIR="/var/www/fortcordis-stage"
            BRANCH="stage"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git checkout"
              exit 1
            fi

            cd "$APP_DIR"
            echo "Loading the stage deploy scripts from origin/${BRANCH}..."
            git fetch origin "$BRANCH"
            deploy_scripts_dir="$(mktemp -d)"
            cleanup_deploy_scripts() {
              rm -rf -- "$deploy_scripts_dir"
            }
            trap cleanup_deploy_scripts EXIT
            git archive --format=tar "origin/${BRANCH}" -- \
              scripts/deploy_stage_vps.sh \
              scripts/deploy_prod_vps.sh \
              scripts/ensure_nginx_http2.sh | tar -xf - -C "$deploy_scripts_dir"

            echo "Running standardized stage deploy script..."
            SUDO_PASSWORD='${{ secrets.VPS_SUDO_PASSWORD }}' \
              APP_DIR="$APP_DIR" \
              BRANCH="$BRANCH" \
              bash "$deploy_scripts_dir/scripts/deploy_stage_vps.sh"
          EOF

      - name: Verify HTTP/2 on shared app hosts
        run: |
          set -euo pipefail
          for host in app.stage.fortcordis.com.br app.fortcordis.com.br; do
            protocol="$(curl --noproxy '*' --silent --show-error --fail --http2 \
              --connect-timeout 8 --max-time 20 --output /dev/null --write-out '%{http_version}' \
              "https://${host}/")"
            if [ "$protocol" != "2" ] && [ "$protocol" != "2.0" ]; then
              echo "Expected HTTP/2 for ${host}; negotiated ${protocol:-none}." >&2
              exit 1
            fi
          done

      - name: Run one-shot AI echo canary on Stage
        if: contains(github.event.head_commit.message, '[ai-echo-canary]')
        run: |
          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd /var/www/fortcordis-stage
            backend/venv/bin/python scripts/ai_echo_stage_canary.py \
              --base-url http://127.0.0.1:8001 \
              --backend-dir /var/www/fortcordis-stage/backend \
              --audio-file /var/www/fortcordis-stage/backend/evals/ai_echo_canary_pt_br.m4a
          EOF
