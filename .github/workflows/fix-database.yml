name: Fix Database (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (stage or production)"
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production

jobs:
  fix-database:
    runs-on: ubuntu-latest
    steps:
      - name: Exigir dispatch a partir de main para producao
        if: inputs.environment == 'production'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Vale a mesma regra dos workflows exclusivos de produção: o YAML
          # executado vem do ref do dispatch, entao rodar com environment=
          # production a partir de `stage` executaria passos nao promovidos.
          if [[ "${DISPATCH_REF}" != "refs/heads/main" ]]; then
            echo "::error::environment=production exige dispatch com a branch 'main' (ref recebido: ${DISPATCH_REF})."
            exit 1
          fi
          echo "OK: dispatch a partir de main."

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.environment == 'stage' && 'stage' || 'main' }}

      - name: Setup SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Fix Database
        run: |
          if [ "${{ inputs.environment }}" == "stage" ]; then
            PROJECT_DIR="/var/www/fortcordis-stage"
            SERVICE_NAME="fortcordis-stage-backend"
            BRANCH="stage"
          else
            PROJECT_DIR="/var/www/fortcordis-v2"
            SERVICE_NAME="fortcordis-backend"
            BRANCH="main"
          fi

          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -euo pipefail
            echo "Fixing database on: ${{ inputs.environment }}"
            cd $PROJECT_DIR

            echo "Updating code..."
            git fetch origin
            git reset --hard origin/$BRANCH

            echo "Running diagnostics..."
            cd backend
            source venv/bin/activate
            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi
            python3 diagnostico_vps.py || true

            echo "Running setup and migrations..."
            python3 setup_database.py

            echo "Restarting backend service..."
            sudo systemctl restart $SERVICE_NAME

            echo "Checking service status..."
            sleep 2
            sudo systemctl is-active $SERVICE_NAME
          EOF

      - name: API Probe
        run: |
          if [ "${{ inputs.environment }}" == "stage" ]; then
            URL="https://stage.fortcordis.com.br/api/v1/auth/login"
          else
            URL="https://fortcordis.com.br/api/v1/auth/login"
          fi

          echo "Probing API endpoint: $URL"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP status: $code"
          if [ "$code" != "405" ] && [ "$code" != "200" ] && [ "$code" != "401" ]; then
            echo "Unexpected status code from API probe"
            exit 1
          fi
