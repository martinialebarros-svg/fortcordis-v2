name: SDD Guardrail

on:
  pull_request:
    branches:
      - stage
      - main

jobs:
  sdd-guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: diff
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Run SDD guardrail
        run: |
          python3 scripts/ci/check_sdd_guardrail.py \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}"

      # Complementar ao guardrail acima: ele exige que o verify.md mude junto
      # com o codigo, este exige que a matriz fique num formato que o gate de
      # promocao consiga ler. Sem coluna `Status`, o gate ignora a tabela e um
      # criterio `pendente` atravessa a promocao com o PR verde.
      - name: Verificar formato da matriz do verify.md
        run: |
          python3 scripts/ci/check_verify_matrix_format.py \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}"
