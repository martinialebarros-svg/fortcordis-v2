name: Inventory Nginx TLS Listeners (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

# Compartilha a trava dos deploys para a leitura nao observar um reload em
# andamento. O job executa apenas comandos de diagnostico.
concurrency:
  group: fortcordis-vps-deploy
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exigir dispatch a partir de stage
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${DISPATCH_REF}" != "refs/heads/stage" ]]; then
            echo "::error::O inventario deve ser disparado a partir da branch stage."
            exit 1
          fi

      - name: Checkout stage
        uses: actions/checkout@v5
        with:
          ref: stage

      - name: Check the inventory script syntax
        run: bash -n scripts/inventory_nginx_tls_listeners.sh

      - name: Setup SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Inventory active TLS listeners without mutation
        run: |
          ssh -i ~/.ssh/id_vps -o IdentitiesOnly=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "SUDO_PASSWORD='${{ secrets.VPS_SUDO_PASSWORD }}' INVENTORY_HOSTS='app.stage.fortcordis.com.br,app.fortcordis.com.br' bash -s" \
            < scripts/inventory_nginx_tls_listeners.sh
