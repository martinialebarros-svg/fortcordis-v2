name: Frontend Typecheck

# Roda `tsc --noEmit` sobre o frontend inteiro, em PR e em push.
#
# Por que nao basta o `npm run build` que o quality-gate ja faz: o `next build`
# so verifica tipos do que entra no grafo de compilacao. Arquivo de teste nao e
# importado por pagina nenhuma, entao fica de fora. Foi assim que tres erros
# TS2322 em `app/whatsapp-stage/AppointmentQueue.test.tsx` chegaram em stage e
# ficaram dias sem ninguem ver, com build e lint verdes o tempo todo.
#
# O `tsconfig.json` inclui `**/*.tsx`, entao o `tsc` cobre o que o build nao
# cobre. E roda em `pull_request` de proposito: gate que so roda depois do merge
# nao e gate.

on:
  pull_request:
    branches:
      - stage
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-typecheck.yml"
  push:
    branches:
      - stage
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-typecheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tipos-devem-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
